
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FinTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>.container-narrow{max-width:1200px}.table td,.table th{vertical-align:middle}</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">FinTrack</a>
    <ul class="navbar-nav flex-row gap-3">
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('dashboard') }}">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('transactions') }}">Movimientos</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('import_csv') }}">Importar</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('export_csv') }}">Exportar</a></li>
      <li class="nav-item"><a class="nav-link text-white" href="{{ url_for('projections_list') }}">Proyecciones</a></li>
    </ul>
  </div>
</nav>
<div class="container container-narrow my-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat,msg in messages %}
        <div class="alert alert-{{cat}} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
